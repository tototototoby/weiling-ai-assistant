<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>招聘海报</title>
  <style>
    :root {
      --poster-bg: __POSTER_BACKGROUND_URL__;
      --blue: #77c9ec; --blue-deep: #19323c; --red: #fcaba7; --ink: #19323c; --paper: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .canvas {
      position: fixed; top: 0; left: 0; width: 900px; height: 1600px; overflow: hidden;
      color: var(--ink); background: var(--paper);
    }
    .background-layer {
      position: absolute; inset: 0; z-index: 0;
      background-image: var(--poster-bg); background-size: cover; background-position: center;
      opacity: 1;
    }
    .blue-band {
      position: absolute; left: 0; right: 0; top: 0; height: 400px; z-index: 1;
      background: linear-gradient(135deg, var(--blue-deep) 0%, var(--blue) 62%, #9edaf4 100%);
      clip-path: polygon(0 0, 100% 0, 100% 84%, 0 100%);
    }
    .red-rule {
      position: absolute; left: 74px; top: 448px; width: 96px; height: 12px; z-index: 2;
      background: var(--red);
    }
    .content {
      position: absolute; inset: 0; z-index: 3; padding: 88px 76px 72px;
      display: flex; flex-direction: column;
    }
    .eyebrow {
      display: inline-flex; align-self: flex-start; align-items: center; gap: 14px;
      padding: 12px 22px; border: 1px solid rgba(255,255,255,0.72); border-radius: 999px;
      color: #ffffff; font-size: 28px; font-weight: 700; letter-spacing: 4px;
      background: rgba(255,255,255,0.12);
    }
    .eyebrow-dot { width: 14px; height: 14px; border-radius: 50%; background: #fcaba7; }
    .title {
      margin: 64px 0 0; color: #ffffff; font-size: 88px; line-height: 1.12; font-weight: 900;
    }
    .subtitle { margin: 28px 0 0; color: #eaf8fc; font-size: 38px; line-height: 1.45; font-weight: 500; }
    .roles {
      margin-top: 56px; display: grid; gap: 26px;
    }
    .role {
      display: flex; align-items: center; justify-content: space-between; gap: 24px;
      padding: 30px 34px; background: #f9fcfd; border-left: 10px solid var(--red);
      font-size: 34px; font-weight: 700; color: var(--ink);
    }
    .role-tag {
      flex: 0 0 auto; padding: 10px 20px; border-radius: 999px; background: var(--blue);
      color: #ffffff; font-size: 24px; font-weight: 700;
    }
    .body {
      margin-top: 44px; padding: 40px 48px; background: #ffffff; border-left: 10px solid var(--blue);
      font-size: 32px; line-height: 1.8; font-weight: 500;
    }
    .contact {
      margin-top: 36px; display: flex; align-items: center; gap: 20px;
      font-size: 30px; font-weight: 700; color: var(--blue-deep);
    }
    .contact-mark {
      width: 44px; height: 44px; border-radius: 50%; background: var(--red);
      color: #ffffff; display: inline-flex; align-items: center; justify-content: center;
      font-size: 24px; font-weight: 900;
    }
    .footer {
      margin-top: auto; display: flex; align-items: center; justify-content: space-between;
      padding-top: 28px; border-top: 3px solid var(--blue);
      font-size: 28px; font-weight: 700; color: var(--blue-deep);
    }
    .brand { display: inline-flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px;
      border-radius: 8px; background: var(--red); color: #ffffff; font-size: 24px; font-weight: 900;
    }
    .assistant-name { color: var(--red); }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="background-layer"></div>
    <div class="blue-band"></div>
    <div class="red-rule"></div>
    <section class="content">
      <div class="eyebrow"><span class="eyebrow-dot"></span><span>诚聘英才</span></div>
      <h1 class="title">招聘主标题</h1>
      <div class="subtitle">单位 / 团队一句话介绍</div>
      <div class="roles">
        <div class="role"><span>岗位名称 1</span><span class="role-tag">招聘中</span></div>
        <div class="role"><span>岗位名称 2</span><span class="role-tag">招聘中</span></div>
        <div class="role"><span>岗位名称 3</span><span class="role-tag">招聘中</span></div>
      </div>
      <div class="body">任职要求 / 福利亮点一句话或要点。</div>
      <div class="contact"><span class="contact-mark">联</span><span>联系人 / 电话 / 邮箱</span></div>
      <footer class="footer">
        <span class="brand"><span class="brand-mark">灵</span><span>微Link · 微灵 AI 助手</span></span>
        <span class="assistant-name">微Link</span>
      </footer>
    </section>
  </main>
</body>
</html>
