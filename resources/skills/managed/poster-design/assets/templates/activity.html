<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>活动通知海报</title>
  <style>
    :root {
      --poster-bg: __POSTER_BACKGROUND_URL__;
      --blue: #77c9ec;
      --blue-deep: #19323c;
      --red: #fcaba7;
      --red-soft: #ffd9d6;
      --ink: #19323c;
      --paper: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      font-family: "Noto Sans SC", "Source Han Sans SC", "Microsoft YaHei", "PingFang SC", sans-serif;
    }
    .canvas {
      position: fixed; top: 0; left: 0; width: 900px; height: 1600px; overflow: hidden;
      color: var(--ink); background: var(--paper);
    }
    .background-layer {
      position: absolute; inset: 0; z-index: 0;
      background-image: var(--poster-bg); background-size: cover; background-position: center;
      opacity: 1;
    }
    .blue-band {
      position: absolute; left: 0; right: 0; top: 0; height: 380px; z-index: 1;
      background: linear-gradient(135deg, var(--blue-deep) 0%, var(--blue) 62%, #9edaf4 100%);
      clip-path: polygon(0 0, 100% 0, 100% 84%, 0 100%);
    }
    .red-rule {
      position: absolute; left: 74px; top: 428px; width: 96px; height: 12px; z-index: 2;
      background: var(--red);
    }
    .content {
      position: absolute; inset: 0; z-index: 3; padding: 88px 76px 72px;
      display: flex; flex-direction: column;
    }
    .eyebrow {
      display: inline-flex; align-self: flex-start; align-items: center; gap: 14px;
      padding: 12px 22px; border: 1px solid rgba(255,255,255,0.72); border-radius: 999px;
      color: #ffffff; font-size: 28px; font-weight: 700; letter-spacing: 4px;
      background: rgba(255,255,255,0.12);
    }
    .eyebrow-dot { width: 14px; height: 14px; border-radius: 50%; background: #fcaba7; }
    .title {
      margin: 64px 0 0; color: #ffffff; font-size: 88px; line-height: 1.12; font-weight: 900;
    }
    .subtitle { margin: 28px 0 0; color: #eaf8fc; font-size: 38px; line-height: 1.45; font-weight: 500; }
    .info {
      margin-top: 56px; display: grid; gap: 24px;
    }
    .info-row {
      display: flex; align-items: flex-start; gap: 24px;
      padding: 26px 30px; background: #f9fcfd; border-left: 10px solid var(--blue);
      font-size: 34px; line-height: 1.5; font-weight: 600; color: var(--ink);
    }
    .info-label {
      flex: 0 0 auto; color: var(--red); font-weight: 800; letter-spacing: 2px;
    }
    .body {
      margin-top: 44px; padding: 44px 52px; border-left: 10px solid var(--red);
      background: #ffffff; font-size: 34px; line-height: 1.85; font-weight: 500;
    }
    .body ul { margin: 0; padding: 0; list-style: none; }
    .body li { position: relative; padding-left: 42px; margin-top: 18px; }
    .body li::before {
      content: ""; position: absolute; left: 0; top: 0.78em; width: 20px; height: 8px;
      background: var(--blue);
    }
    .footer {
      margin-top: auto; display: flex; align-items: center; justify-content: space-between;
      padding-top: 28px; border-top: 3px solid var(--blue);
      font-size: 28px; font-weight: 700; color: var(--blue-deep);
    }
    .brand { display: inline-flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: inline-flex; align-items: center; justify-content: center; width: 42px; height: 42px;
      border-radius: 8px; background: var(--red); color: #ffffff; font-size: 24px; font-weight: 900;
    }
    .assistant-name { color: var(--red); }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="background-layer"></div>
    <div class="blue-band"></div>
    <div class="red-rule"></div>
    <section class="content">
      <div class="eyebrow"><span class="eyebrow-dot"></span><span>活动预告</span></div>
      <h1 class="title">活动主标题</h1>
      <div class="subtitle">一句话活动亮点</div>
      <div class="info">
        <div class="info-row"><span class="info-label">时间</span><span>X月X日 14:00</span></div>
        <div class="info-row"><span class="info-label">地点</span><span>活动地点</span></div>
        <div class="info-row"><span class="info-label">报名</span><span>联系部门 / 扫码报名</span></div>
      </div>
      <div class="body">
        <ul>
          <li>活动要点 1</li>
          <li>活动要点 2</li>
          <li>活动要点 3</li>
        </ul>
      </div>
      <footer class="footer">
        <span class="brand"><span class="brand-mark">灵</span><span>微Link · 微灵 AI 助手</span></span>
        <span class="assistant-name">微Link</span>
      </footer>
    </section>
  </main>
</body>
</html>
