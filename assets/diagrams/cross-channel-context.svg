<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="720" viewBox="0 0 1500 720" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF8FC"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD0CD"/><stop offset="1" stop-color="#F7A5A2"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C6EDFA"/><stop offset="1" stop-color="#9EDAF4"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#5C9DB8" flood-opacity="0.18"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A7C7D0"/></marker>
  </defs>

  <rect width="1500" height="720" rx="32" fill="#F9FCFD"/>
  <text x="72" y="82" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="38" font-weight="800" fill="#19323C">一个用户，多个入口，同一件事</text>
  <text x="72" y="120" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="19" fill="#56717A">通道只是入口；目标、对话和任务状态跟着用户走</text>
  <g><rect x="72" y="192" width="220" height="92" rx="24" fill="#FFFFFF" stroke="#D9E9ED"/><rect x="72" y="192" width="7" height="92" rx="4" fill="#FCABA7"/><text x="102" y="236" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="750" fill="#19323C">微信</text><text x="102" y="270" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="16" fill="#56717A">路上发语音</text></g>
  <g><rect x="72" y="314" width="220" height="92" rx="24" fill="#FFFFFF" stroke="#D9E9ED"/><rect x="72" y="314" width="7" height="92" rx="4" fill="#77C9EC"/><text x="102" y="358" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="750" fill="#19323C">企业微信</text><text x="102" y="392" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="16" fill="#56717A">工作中回一句</text></g>
  <g><rect x="72" y="436" width="220" height="92" rx="24" fill="#FFFFFF" stroke="#D9E9ED"/><rect x="72" y="436" width="7" height="92" rx="4" fill="#81D1B2"/><text x="102" y="480" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="750" fill="#19323C">飞书</text><text x="102" y="514" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="16" fill="#56717A">继续调用办公能力</text></g>
  <g><rect x="390" y="288" width="280" height="142" rx="24" fill="#FFFFFF" stroke="#D9E9ED"/><rect x="390" y="288" width="7" height="142" rx="4" fill="#77C9EC"/><text x="420" y="332" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="750" fill="#19323C">身份绑定</text><text x="420" y="366" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="16" fill="#56717A">把不同通道账号关联到同一位用户</text></g>
  <g><rect x="770" y="258" width="310" height="202" rx="24" fill="#FFFFFF" stroke="#D9E9ED"/><rect x="770" y="258" width="7" height="202" rx="4" fill="#FCABA7"/><text x="800" y="302" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="750" fill="#19323C">共享上下文</text><text x="800" y="336" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="16" fill="#56717A">目标 · 消息 · 文件 · 进度
提醒 · 下一步 · 任务状态</text></g>
  <g><rect x="1180" y="288" width="250" height="142" rx="24" fill="#FFFFFF" stroke="#D9E9ED"/><rect x="1180" y="288" width="7" height="142" rx="4" fill="#81D1B2"/><text x="1210" y="332" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="750" fill="#19323C">任一端继续</text><text x="1210" y="366" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="16" fill="#56717A">无需重复交代，选择方便的入口接着做</text></g>
  <path d="M292 238 L390 325" stroke="#A7C7D0" stroke-width="3" marker-end="url(#arrow)"/><path d="M292 360 L390 360" stroke="#A7C7D0" stroke-width="3" marker-end="url(#arrow)"/><path d="M292 482 L390 393" stroke="#A7C7D0" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M670 360 L770 360" stroke="#A7C7D0" stroke-width="3" marker-end="url(#arrow)"/><path d="M1080 360 L1180 360" stroke="#A7C7D0" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="750" y="610" text-anchor="middle" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="25" font-weight="700" fill="#19323C">刚才在微信里交代到一半，换到飞书，它也记得。</text>
</svg>
