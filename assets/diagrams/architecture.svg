<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EAF8FC"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD0CD"/><stop offset="1" stop-color="#F7A5A2"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C6EDFA"/><stop offset="1" stop-color="#9EDAF4"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#5C9DB8" flood-opacity="0.18"/></filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="28"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#A7C7D0"/></marker>
  </defs>

  <rect width="1500" height="900" rx="32" fill="#F9FCFD"/>
  <text x="72" y="84" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="38" font-weight="800" fill="#19323C">微Link 系统架构</text>
  <text x="72" y="122" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="19" fill="#56717A">控制面写入持久化意图，Supervisor 收敛运行状态，FastAgent 与独立沙箱执行任务</text>
  <g><rect x="72" y="202" width="250" height="104" rx="24" fill="#FFFFFF" stroke="#D9E9ED"/><rect x="72" y="202" width="7" height="104" rx="4" fill="#FCABA7"/><text x="102" y="246" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="750" fill="#19323C">微信 / 企微 / 飞书</text><text x="102" y="280" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="16" fill="#56717A">用户在熟悉的聊天工具中发起任务</text></g>
  <g><rect x="72" y="344" width="250" height="104" rx="24" fill="#FFFFFF" stroke="#D9E9ED"/><rect x="72" y="344" width="7" height="104" rx="4" fill="#FCABA7"/><text x="102" y="388" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="750" fill="#19323C">Web 控制台</text><text x="102" y="422" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="16" fill="#56717A">注册、领取、配置与查看状态</text></g>
  <g><rect x="430" y="272" width="260" height="122" rx="24" fill="#FFFFFF" stroke="#D9E9ED"/><rect x="430" y="272" width="7" height="122" rx="4" fill="#77C9EC"/><text x="460" y="316" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="750" fill="#19323C">统一身份与会话</text><text x="460" y="350" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="16" fill="#56717A">关联用户、通道与同一套上下文</text></g>
  <g><rect x="798" y="196" width="260" height="104" rx="24" fill="#FFFFFF" stroke="#D9E9ED"/><rect x="798" y="196" width="7" height="104" rx="4" fill="#81D1B2"/><text x="828" y="240" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="750" fill="#19323C">SQLite</text><text x="828" y="274" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="16" fill="#56717A">用户配置、运行意图与状态事实</text></g>
  <g><rect x="798" y="344" width="260" height="104" rx="24" fill="#FFFFFF" stroke="#D9E9ED"/><rect x="798" y="344" width="7" height="104" rx="4" fill="#77C9EC"/><text x="828" y="388" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="750" fill="#19323C">Supervisor</text><text x="828" y="422" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="16" fill="#56717A">调度、恢复、事件消费与状态收敛</text></g>
  <g><rect x="1166" y="272" width="260" height="122" rx="24" fill="#FFFFFF" stroke="#D9E9ED"/><rect x="1166" y="272" width="7" height="122" rx="4" fill="#FCABA7"/><text x="1196" y="316" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="750" fill="#19323C">FastAgent Runtime</text><text x="1196" y="350" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="16" fill="#56717A">模型、工具、Skills、MCP 与任务执行</text></g>
  <g><rect x="430" y="590" width="260" height="122" rx="24" fill="#FFFFFF" stroke="#D9E9ED"/><rect x="430" y="590" width="7" height="122" rx="4" fill="#77C9EC"/><text x="460" y="634" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="750" fill="#19323C">用户 A 沙箱</text><text x="460" y="668" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="16" fill="#56717A">独立工作区、进程池与任务状态</text></g>
  <g><rect x="798" y="590" width="260" height="122" rx="24" fill="#FFFFFF" stroke="#D9E9ED"/><rect x="798" y="590" width="7" height="122" rx="4" fill="#77C9EC"/><text x="828" y="634" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="750" fill="#19323C">用户 B 沙箱</text><text x="828" y="668" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="16" fill="#56717A">文件和上下文互不混用</text></g>
  <g><rect x="1166" y="590" width="260" height="122" rx="24" fill="#FFFFFF" stroke="#D9E9ED"/><rect x="1166" y="590" width="7" height="122" rx="4" fill="#81D1B2"/><text x="1196" y="634" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="22" font-weight="750" fill="#19323C">浏览器与外部工具</text><text x="1196" y="668" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="16" fill="#56717A">Browserless、飞书能力与其他 MCP</text></g>
  <path d="M322 254 L430 318" stroke="#A7C7D0" stroke-width="3" marker-end="url(#arrow)"/><path d="M322 396 L430 340" stroke="#A7C7D0" stroke-width="3" marker-end="url(#arrow)"/>
