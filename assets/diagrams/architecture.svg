  <path d="M1296 394 L1296 590" stroke="#A7C7D0" stroke-width="3" marker-end="url(#arrow)"/><path d="M1166 650 L1058 650" stroke="#A7C7D0" stroke-width="3" marker-end="url(#arrow)"/><path d="M798 650 L690 650" stroke="#A7C7D0" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="72" y="792" width="1354" height="54" rx="16" fill="#E7F5F8"/>
  <text x="98" y="826" font-family="'Microsoft YaHei','Noto Sans CJK SC','PingFang SC',Arial,sans-serif" font-size="17" fill="#56717A">安全边界：默认面向可信宿主机与受控用户；高权限容器不是抵御恶意租户的强隔离边界。</text>
