name: Source prerelease

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tagged source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20.18.1
          cache: pnpm

      - name: Verify tag matches product version
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(tr -d '\r\n' < VERSION)"
          test "${GITHUB_REF_NAME}" = "${expected}" || {
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${expected})" >&2
            exit 1
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release checks
        run: |
          pnpm version:check
          pnpm test
          pnpm typecheck
          pnpm build

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: weiling-ai-assistant-source.spdx.json
          upload-artifact: false

      - name: Upload verified release inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-release-inputs-${{ github.ref_name }}
          path: |
            weiling-ai-assistant-source.spdx.json
            VERSION
            LICENSE
            LICENSE-COMMERCIAL.md
            NOTICE
            THIRD_PARTY_NOTICES.md
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub prerelease
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download verified release inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source-release-inputs-${{ github.ref_name }}

      - name: Create source-only prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          notes_args=(--generate-notes)
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "${notes_file}" ]]; then
            notes_args=(--notes-file "${notes_file}")
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "微Link · 微灵 AI 助手 ${GITHUB_REF_NAME}" \
            --prerelease \
            "${notes_args[@]}" \
            weiling-ai-assistant-source.spdx.json \
            LICENSE \
            LICENSE-COMMERCIAL.md \
            NOTICE \
            THIRD_PARTY_NOTICES.md
